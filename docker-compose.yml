services:
  nginx:
    image: nginx:alpine
    platform: ${DOCKER_DEFAULT_PLATFORM:-linux/amd64}
    container_name: open-report-map-nginx
    restart: unless-stopped
    ports:
      - "4000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api
      - web
    networks:
      - open-report-map-network

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    platform: ${DOCKER_DEFAULT_PLATFORM:-linux/amd64}
    container_name: open-report-map-api
    restart: unless-stopped
    env_file: .env.example
    volumes:
      - ./:/var/www/html
      - ./public/uploads:/var/www/html/public/uploads
    depends_on:
      - mysql
    networks:
      - open-report-map-network

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    platform: ${DOCKER_DEFAULT_PLATFORM:-linux/amd64}
    container_name: open-report-map-web
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:4000
    volumes:
      - ./:/app
    networks:
      - open-report-map-network

  mysql:
    image: mysql:8.0
    platform: ${DOCKER_DEFAULT_PLATFORM:-linux/amd64}
    container_name: open-report-map-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: openreportmap
      MYSQL_USER: orm
      MYSQL_PASSWORD: orm
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - open-report-map-network

networks:
  open-report-map-network:
    driver: "bridge"

volumes:
  mysql-data:
